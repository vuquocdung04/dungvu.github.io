<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dung Vu — Unity Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece3cf; --paper:#f7f1e3; --card:#fbf7ee; --ink:#2a2420; --soft:#6e6255; --line:#2a2420;
  --red:#d9482b; --gold:#e0a526; --teal:#3f7d6e; --blue:#3a6ea5; --shade:#cfc3a9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;line-height:1.45;min-height:100vh;padding:24px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.panel{background:var(--paper);border:2px solid var(--line);border-radius:10px;box-shadow:4px 4px 0 var(--line)}

/* header */
header.panel{display:flex;align-items:center;gap:22px;padding:20px 24px;flex-wrap:wrap;position:relative;overflow:hidden}
header.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;
  background:linear-gradient(var(--red) 0 33.3%,var(--gold) 0 66.6%,var(--teal) 0)}
.logowrap{position:relative;flex-shrink:0;margin-left:6px}
.logo{width:92px;height:116px;border-radius:12px;overflow:hidden;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:24px;letter-spacing:-1px;flex-shrink:0;border:3px solid var(--paper);outline:2px solid var(--ink)}
.who{flex:1;min-width:240px}
.who h1{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.role{font-size:16px;color:var(--soft);margin-top:4px}
.role b{color:var(--red);font-weight:500}
.tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 8px;border:1.5px solid var(--line);border-radius:999px;background:var(--card)}
.contact{display:flex;align-items:center}
.crow{display:flex;align-items:center;gap:18px}
.clist{display:grid;grid-template-columns:auto;gap:5px;padding:10px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:10px}
.ci{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);text-decoration:none;min-width:0}
.ci .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.ci .ic svg{width:13px;height:13px}
.ci span.t{white-space:nowrap}
.ci .cp{margin-left:auto;padding:2px;border:0;background:none;cursor:pointer;color:var(--soft);opacity:0;transition:opacity .15s;display:flex}
.ci .cp svg{width:14px;height:14px}
.ci:hover .cp{opacity:1}.ci .cp:hover{color:var(--red)}
a.ci:hover .t{color:var(--red);text-decoration:underline}
/* xp */
.xp{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.lv{font:700 11px 'IBM Plex Mono',monospace;background:var(--ink);color:var(--gold);padding:3px 7px;border-radius:5px;letter-spacing:1px}
.segs{display:flex;gap:3px;padding:3px;border:1.5px solid var(--line);border-radius:6px;background:var(--card)}
.segs i{width:14px;height:10px;border-radius:2px;background:#e3d8bf}
.segs i.on{background:var(--teal);animation:fillin .3s both}
.segs i.on:last-of-type{}
@keyframes fillin{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.xpt{font:12px 'IBM Plex Mono',monospace;color:var(--soft)}
.xpt b{color:var(--ink);font-weight:500}
/* photo resize */
.rz{display:none;position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;border-radius:5px;background:var(--gold);border:2px solid var(--line);cursor:nwse-resize;touch-action:none;z-index:2}
.rz::after{content:"";position:absolute;inset:3px;border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
body.editing .rz{display:block}
/* avatar garden — leaves & flowers peeking from behind the frame */
.logo{position:relative;z-index:1}
.bloom{position:absolute;inset:0;pointer-events:none;z-index:0}
.bloom .sp{position:absolute;left:50%;top:50%;will-change:transform}
.bloom svg{width:100%;height:100%;display:block;overflow:visible}
.bloom .tuck{position:absolute;width:30px;height:30px;transform-origin:var(--o);transform:rotate(var(--r));animation:sway 3.8s ease-in-out infinite}
.bloom .tuck.a{left:-15px;top:-13px;--o:85% 85%;--r:-10deg}
.bloom .tuck.b{left:-14px;bottom:12px;width:24px;height:24px;--o:90% 30%;--r:-75deg;animation-delay:-1.3s}
.bloom .tuck.c{right:-11px;top:-12px;width:20px;height:20px;--o:20% 80%;--r:12deg;animation-delay:-2.4s}
@keyframes sway{0%,100%{transform:rotate(var(--r))}50%{transform:rotate(calc(var(--r) + 12deg))}}
@media (prefers-reduced-motion:reduce){.bloom .tuck{animation:none}}
/* drag to reorder (edit mode) */
body.editing .card{cursor:grab}
.card img{-webkit-user-drag:none;user-select:none}
.card.dragging{opacity:.3;box-shadow:none!important;transform:none!important;outline:2px dashed var(--line);outline-offset:-2px}
.drag-ghost{position:fixed!important;left:0;top:0;z-index:50;pointer-events:none;margin:0;box-shadow:6px 6px 0 var(--line)!important;transition:none!important}
body.dragging-card,body.dragging-card *{cursor:grabbing!important;user-select:none}
.btn{display:inline-block;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;color:var(--paper);background:var(--red);
  padding:9px 16px;border:2px solid var(--line);border-radius:8px;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.small{font-size:12px;color:var(--soft)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.stat{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer;transition:transform .08s,box-shadow .08s}
.stat:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.stat:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.stat .k::after{content:" →";opacity:0;transition:opacity .15s}
.stat:hover .k::after{opacity:1}
/* highlight animation */
body.focusing .card:not(.hl),body.focusing .company:not(.hl){opacity:.35;filter:saturate(.4);transition:opacity .25s,filter .25s}
.card.hl{animation:hop .55s cubic-bezier(.3,1.6,.5,1) both;z-index:1}
.card.hl{box-shadow:0 0 0 3px var(--gold),4px 4px 0 3px var(--line)}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-12px) scale(1.05)}70%{transform:translateY(2px) scale(.99)}100%{transform:none}}
.company.hl span:first-child{animation:hop .55s cubic-bezier(.3,1.6,.5,1) both;display:inline-block;background:var(--gold);padding:0 6px;border-radius:5px}
.stat .k{font-size:11px;color:var(--soft);letter-spacing:1px;text-transform:uppercase}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-1px}
.c-red{color:var(--red)}.c-gold{color:#b5831a}.c-teal{color:var(--teal)}.c-blue{color:var(--blue)}

/* main */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
section.panel{overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:2px solid var(--line);background:var(--card)}
.bar .stripes{flex:1;height:10px;background:repeating-linear-gradient(0deg,var(--line) 0 1.5px,transparent 1.5px 3.5px);opacity:.55}
.bar h2{font-size:14px;font-weight:700;letter-spacing:.5px}
.bar h2 em{font-style:normal;color:var(--red)}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.dots i:nth-child(1){background:var(--red)}.dots i:nth-child(2){background:var(--gold)}.dots i:nth-child(3){background:var(--teal)}
.body{padding:14px 16px 16px}
.company{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px;font-size:13px}
.company:first-child{margin-top:0}
.company span:first-child{font-weight:700;font-size:15px}
.company span:last-child{color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--card);border:2px solid var(--line);border-radius:8px;
  color:var(--ink);font:inherit;text-align:left;width:100%;cursor:pointer;transition:transform .08s,box-shadow .08s}
.card:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--line)}
.card:active{transform:none;box-shadow:none}
#mIcon{width:56px;height:56px;border-radius:12px;overflow:hidden;border:2px solid var(--line);color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;flex-shrink:0}
.card .n{font-weight:500;font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--soft);margin-top:2px}
.card .s.dl{color:var(--teal)}
.card .s.dl::before{content:"↓ "}
.card .s.store{color:var(--blue)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(42,36,32,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.overlay.open{display:flex}
.modal{width:min(820px,100%);max-height:calc(100vh - 40px);overflow:auto;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal .bar h3{font-size:14px;font-weight:700}
.x{width:22px;height:22px;border:2px solid var(--line);border-radius:5px;background:var(--paper);cursor:pointer;font:700 12px 'Space Grotesk',sans-serif;color:var(--ink)}
.x:hover{background:var(--red);color:var(--paper)}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#mIcon{width:112px;height:63px;font-size:20px;border-radius:10px}
.ico img,#mIcon img,.logo img,.ipv img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(var(--z,1))}
/* game tiles: art takes most of the card */
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important;gap:12px!important}
.card{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;position:relative;border-radius:10px}
.ico{width:100%;aspect-ratio:16/9;border:0;border-bottom:2px solid var(--line);border-radius:0;overflow:hidden;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;letter-spacing:-1px;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.09) 0 8px,transparent 8px 16px)}
.ico img{transition:transform .25s}
.card:hover .ico img{transform:scale(calc(var(--z,1)*1.06))}
.card .meta2{padding:7px 9px 8px;min-width:0}
.card .n{font-size:13.5px;font-weight:500;line-height:1.2;-webkit-line-clamp:2!important}
.card .s{font-size:10.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tagdl{position:absolute;top:7px;left:7px;display:flex;align-items:center;gap:4px;font:700 11px 'IBM Plex Mono',monospace;
  background:var(--ink);color:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:2px 7px 2px 5px;box-shadow:2px 2px 0 rgba(42,36,32,.35);letter-spacing:.2px}
.card .tagdl svg{width:12px;height:12px;color:var(--gold)}
.card .tagdl.store{background:var(--blue);border-color:var(--ink);padding-left:7px}
/* modal stats */
.mstats{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mstats:empty{display:none}
.mstat{display:inline-flex;align-items:center;gap:5px;font:700 12px 'IBM Plex Mono',monospace;padding:3px 9px 3px 7px;border:1.5px solid var(--line);border-radius:7px;background:var(--ink);color:#fff}
.mstat svg{width:14px;height:14px;color:var(--gold)}
.mstat span{font-weight:400;opacity:.75}
.mstat.store{background:var(--blue)}
.mstat.note{background:var(--card);color:var(--ink)}
/* screenshots: skeleton while loading, fade in when ready */
.shots button{min-width:169px;background:linear-gradient(100deg,#efe6d3 30%,#f8f2e4 50%,#efe6d3 70%) 0 0/300% 100%;animation:shimmer 1.1s linear infinite}
.shots button.ok{min-width:0;animation:none;background:var(--card)}
.shots img{opacity:0;transition:opacity .25s}
.shots button.ok img{opacity:1}
@keyframes shimmer{to{background-position:-200% 0}}
body.editing .card::after{position:absolute;top:6px;right:6px;margin:0;width:22px;height:22px;border-radius:6px;background:var(--paper);
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.addtile{min-height:0;aspect-ratio:16/13;flex-direction:column}
.imgrow{display:flex;gap:10px;align-items:center}
.ipv{width:56px;height:56px;border-radius:12px;border:2px solid var(--line);overflow:hidden;flex-shrink:0;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:11px}
.ipv.round{border-radius:50%}
.ipv.wide{width:208px;height:117px;border-radius:8px}
.ipv.round{width:110px;height:110px}
.ipv.tall{width:96px;height:120px;border-radius:10px}
.ipv.has{cursor:grab;touch-action:none}.ipv.has:active{cursor:grabbing}
.ipv img{pointer-events:none;user-select:none}
.imgedit{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.imgside{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.imgside .row{display:flex;gap:8px}
.imgside .row input{flex:1;min-width:0}
.zoomrow{display:flex;align-items:center;gap:8px;font:12px 'IBM Plex Mono',monospace;color:var(--soft)}
.zoomrow input{flex:1;accent-color:var(--red)}
.pastehint{font-size:11px;color:var(--soft);margin-top:4px;font-family:"IBM Plex Mono",monospace}
.imgrow input[type=text]{flex:1;min-width:0}
.up{position:relative;overflow:hidden;white-space:nowrap}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.imgrow .btn{padding:7px 12px;font-size:13px}
.mhead .t{flex:1;min-width:0}
#mTitle{font-size:20px;font-weight:700;letter-spacing:-.3px}
.mhead .meta{font-size:13px;color:var(--soft)}
.links{display:flex;gap:16px 18px;flex-wrap:wrap;padding-top:8px}
.kbtn{position:relative;color:#fff;padding-right:18px}
.kbtn .corner{position:absolute;top:-11px;right:-11px;width:26px;height:26px;border-radius:50%;background:var(--paper);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
.kbtn .corner svg{width:14px;height:14px}
.kbtn:hover .corner{transform:rotate(-12deg) scale(1.12)}
/* screenshots */
.shotswrap{position:relative;margin-top:14px}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:thin}
.shots button{flex:0 0 auto;height:300px;padding:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;scroll-snap-align:start;background:var(--card);box-shadow:3px 3px 0 var(--line)}
.shots img{height:100%;width:auto;display:block;pointer-events:none;user-select:none}
.shots{cursor:grab;user-select:none}
.shots.dragging{cursor:grabbing;scroll-snap-type:none}
.shots.dragging button{cursor:grabbing}
.lightbox img{user-select:none;-webkit-user-drag:none;touch-action:pan-y}
.snav{position:absolute;top:50%;transform:translateY(-60%);width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--paper);
  cursor:pointer;font:700 14px 'Space Grotesk',sans-serif;color:var(--ink);box-shadow:2px 2px 0 var(--line);z-index:1}
.snav.l{left:-10px}.snav.r{right:-10px}
.snav:hover{background:var(--gold)}
.lightbox{position:fixed;inset:0;background:rgba(20,17,15,.9);display:none;align-items:center;justify-content:center;z-index:8;padding:30px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;border:3px solid var(--paper)}
.lightbox .snav{position:fixed;transform:none;top:50%}.lightbox .snav.l{left:20px}.lightbox .snav.r{right:20px}
.lightbox .count{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:var(--paper);font:12px 'IBM Plex Mono',monospace}
/* media field */
.seg{display:inline-flex;border:2px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.f .seg label{padding:6px 14px;font:500 13px 'Space Grotesk',sans-serif;text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer;background:var(--card)}
.seg input{display:none}
.f .seg input:checked+label{background:var(--ink);color:var(--paper)}
.seg label+input+label,.seg input+label+input+label{border-left:2px solid var(--line)}
.mpane{margin-top:8px}
.drop{border:2px dashed var(--soft);border-radius:10px;padding:10px;display:flex;gap:10px;overflow-x:auto;min-height:150px;align-items:center;background:var(--card)}
.drop.over{border-color:var(--red);background:#fbeee6}
.sthumb{position:relative;flex:0 0 auto;height:130px;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.sthumb img{height:100%;display:block}
.sthumb .tb{position:absolute;top:4px;right:4px;display:flex;gap:3px}
.sthumb .tb button{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font:700 11px 'Space Grotesk',sans-serif;padding:0}
.sthumb .tb button:hover{background:var(--gold)}
.sthumb .tb button.del:hover{background:var(--red);color:#fff}
.addshot{flex:0 0 auto;height:130px;width:90px;border:2px dashed var(--soft);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--soft);font:500 12px 'Space Grotesk',sans-serif;cursor:pointer;position:relative;text-align:center;padding:4px}
.addshot:hover{border-color:var(--ink);color:var(--ink)}
.addshot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.links .btn.gh{background:var(--ink)}
.links .btn.doc{background:var(--teal)}
.links .btn.yt{background:var(--red)}
.links .btn.soon{background:var(--card);color:var(--soft);border-style:dashed;box-shadow:none;cursor:default;transform:none}
.screen{position:relative;aspect-ratio:16/9;background:var(--ink);border:2px solid var(--line);border-radius:8px;overflow:hidden;margin-top:14px}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.noise{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--shade);font-size:13px;
  background:radial-gradient(circle at 50% 45%,#3a332c,#211c18)}
.tv{width:56px;height:56px;border-radius:50%;border:2px solid var(--shade);display:flex;align-items:center;justify-content:center;font-size:18px;padding-left:4px}
.desc{margin-top:14px;font-size:15px}
.desc.empty{color:var(--soft);font-style:italic}

/* edit mode */
.editbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--ink);color:var(--paper);border-radius:10px;border:2px solid var(--line)}
body.editing .editbar{display:flex}
.editbar .lbl{flex:1;font-size:13px;min-width:200px}
.editbar .lbl b{color:var(--gold);font-weight:500}
.ebtn{font:500 13px 'Space Grotesk',sans-serif;padding:6px 12px;border:2px solid var(--paper);border-radius:7px;background:transparent;color:var(--paper);cursor:pointer}
.ebtn:hover{background:var(--paper);color:var(--ink)}
.ebtn.pri{background:var(--gold);border-color:var(--gold);color:var(--ink)}
body.editing .card{border-style:dashed}
body.editing .card::after{content:"✎";margin-left:auto;color:var(--soft);font-size:13px}
.addtile{display:none;align-items:center;justify-content:center;gap:6px;padding:8px;min-height:56px;border:2px dashed var(--soft);border-radius:8px;
  background:transparent;color:var(--soft);font:500 13px 'Space Grotesk',sans-serif;cursor:pointer;width:100%}
.addtile:hover{border-color:var(--ink);color:var(--ink);background:var(--card)}
body.editing .addtile{display:flex}
body.editing .company{cursor:pointer}
body.editing .company span:first-child::after{content:"  ✎";color:var(--soft);font-weight:400;font-size:12px}
body.editing header.panel{cursor:pointer;outline:2px dashed var(--soft);outline-offset:4px}
.editlink{color:var(--soft);text-decoration:none;border-bottom:1px dotted var(--soft);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;font:inherit}

/* form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--soft);font-family:'IBM Plex Mono',monospace}
.f input,.f select,.f textarea{font:14px 'Space Grotesk',sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
.f textarea{min-height:72px;resize:vertical}
.f textarea.code{font:12px 'IBM Plex Mono',monospace;min-height:260px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;box-shadow:3px 3px 0 var(--gold)}
.f.chk{flex-direction:row;align-items:center;gap:8px}
.f.chk input{width:18px;height:18px;accent-color:var(--red)}
.f.chk label{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-family:'Space Grotesk',sans-serif}
.linkrows{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:40px 140px minmax(0,1fr) 36px;gap:8px;position:relative}
.icbtn{width:40px;height:40px;border:2px solid var(--line);border-radius:8px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.icbtn svg,.lic svg,.icopt svg{width:20px;height:20px}
.icmenu{position:absolute;top:46px;left:0;z-index:3;background:var(--paper);border:2px solid var(--line);border-radius:10px;box-shadow:4px 4px 0 var(--line);
  padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:max-content}
.icopt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1.5px solid transparent;border-radius:7px;background:none;cursor:pointer;
  font:11px 'Space Grotesk',sans-serif;color:var(--ink);width:74px}
.icopt:hover,.icopt.sel{border-color:var(--line);background:var(--card)}
.icopt i{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;border:1.5px solid var(--line)}
.icopt i svg{width:18px;height:18px}
.lrow .rm{border:2px solid var(--line);border-radius:7px;background:var(--card);cursor:pointer;font:700 13px 'Space Grotesk',sans-serif;color:var(--ink)}
.lrow .rm:hover{background:var(--red);color:var(--paper)}
.addlink{align-self:flex-start;border:2px dashed var(--soft);background:transparent;color:var(--soft);border-radius:7px;padding:6px 12px;font:500 13px 'Space Grotesk',sans-serif;cursor:pointer}
.addlink:hover{border-color:var(--ink);color:var(--ink)}
.links:empty{display:none}
.lbtn{display:inline-flex;align-items:stretch;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:9px;overflow:hidden;
  box-shadow:3px 3px 0 var(--line);transition:transform .08s,box-shadow .08s;position:relative}
.lbtn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.lbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.lic{width:40px;display:flex;align-items:center;justify-content:center;color:#fff;border-right:2px solid var(--line);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 4px,transparent 4px 8px)}
.ltx{padding:9px 26px 9px 12px;font-weight:500;font-size:14px;display:flex;align-items:center}
.lbtn .arr{position:absolute;top:3px;right:6px;font-size:11px;color:var(--soft)}
.lbtn:hover .arr{color:var(--red)}
.err{color:var(--red);font-size:12px;min-height:16px}
.factions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.factions .sp{flex:1}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.danger{background:var(--card);color:var(--red);border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.btn.danger.armed{background:var(--red);color:var(--paper)}
.hint{font-size:12px;color:var(--soft);margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
.toast.on{opacity:1}

.f label.addshot{text-transform:none;letter-spacing:0;font:500 12px 'Space Grotesk',sans-serif;color:var(--soft)}
.ll.flash{animation:flash .6s}
@keyframes flash{0%{background:#f6dd9a}100%{background:var(--card)}}
footer{text-align:center;font-size:11px;color:var(--soft);padding:2px 0}

@media (max-width:1000px){ .crow{flex-direction:column;align-items:stretch;gap:10px} }
@media (max-width:860px){
  main{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .contact{align-items:flex-start;text-align:left}
}
@media (max-width:420px){ .grid{grid-template-columns:1fr} body{padding:14px} }

const KEY = "dv-portfolio-v1";
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
function normalize(d){
  const fix=g=>{ g.links=g.links||[]; [["youtube","YouTube"],["github","GitHub"],["docs","Docs"]].forEach(([k,l])=>{ if(g[k]){ g.links.push({label:l,url:g[k]}); delete g[k]; } }); if(!g.links.length) delete g.links; };
  d.studios.forEach(s=>s.games.forEach(fix)); d.side.forEach(fix);
  const p=d.profile; if(p.subtitle) p.subtitle=p.subtitle.replace(/\s*·\s*\d+\s*months? experience/i,"");
  delete p.tags; if(!p.careerStart) p.careerStart="2026-02"; if(p.school===undefined) p.school="Hanoi University of Education · 2022–2026";
  return d;
}
let DATA = normalize(load());
function load(){ try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){} return clone(DEFAULT_DATA); }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){ toast("Browser storage is full — click Save to project"); } render(); if(typeof autoSync==="function") autoSync(); }
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),1600); }
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const PAL = ["#d9482b","#e0a526","#3f7d6e","#3a6ea5","#8a5a9e","#c96f3b"];
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function frame(img,pos,zoom){ pos=pos||"50% 50%"; img.style.objectPosition=pos; img.style.transformOrigin=pos; img.style.setProperty("--z",zoom||1); return img; }
function setIcon(el,g){ if(g.image){ el.style.backgroundColor="var(--card)"; el.textContent=""; const i=new Image(); i.alt=""; i.src=g.image; i.onerror=()=>badge(el,g.name); el.append(frame(i,g.imagePos,g.imageZoom)); } else badge(el,g.name); }
function badge(el,name){el.innerHTML="";el.style.backgroundColor=PAL[hash(name)%PAL.length];
  el.textContent=name.replace(/[^A-Za-z0-9 ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}

function reorderAt(x,y){

  if(t){ if(t===c) return; const r=t.getBoundingClientRect(); parent=t.parentNode; before=x<r.left+r.width/2?t:t.nextSibling; }

    if(el.closest(".addtile")||gr!==c.parentNode){ parent=gr; before=gr.querySelector(".addtile"); } else return; }
  if(before===c||(c.parentNode===parent&&c.nextSibling===before)) return;

function flip(mutate){

  mutate();
  els.forEach(e=>{ const a=old.get(e), b=e.getBoundingClientRect(), dx=a.left-b.left, dy=a.top-b.top;
    if(dx||dy) e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:170,easing:"ease-out"}); });

/* ---------- avatar garden: leaves & flowers peek out from behind the photo ---------- */
const INK="#2a2420", PETALS=["#d9482b","#e0a526","#3a6ea5","#e07a9a"], LEAVES=["#3f7d6e","#6a9a5b"];
const SPR={
  leaf:c=>`<svg viewBox="0 0 24 24"><path d="M3 21C3 10 10 3 21 3c0 11-7 18-18 18z" fill="${c}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/><path d="M4.5 19.5L14 10" stroke="${INK}" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  flower:(c,k)=>`<svg viewBox="0 0 24 24"><g fill="${c}" stroke="${INK}" stroke-width="1.3">${[0,72,144,216,288].map(a=>`<ellipse cx="12" cy="6.3" rx="3.6" ry="5" transform="rotate(${a} 12 12)"/>`).join("")}</g><circle cx="12" cy="12" r="3" fill="${k}" stroke="${INK}" stroke-width="1.3"/></svg>`,
  spark:c=>`<svg viewBox="0 0 24 24"><path d="M12 1.5l2.5 8 8 2.5-8 2.5-2.5 8-2.5-8-8-2.5 8-2.5z" fill="${c}" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
  petal:c=>`<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="5" ry="9" fill="${c}" stroke="${INK}" stroke-width="1.3"/></svg>`
};
const pick=a=>a[Math.random()*a.length|0];
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
$("bloom").innerHTML=`<span class="tuck a">${SPR.leaf(LEAVES[0])}</span><span class="tuck b">${SPR.leaf(LEAVES[1])}</span><span class="tuck c">${SPR.flower(PETALS[1],PETALS[0])}</span>`;
function sprite(html,size){ const s=document.createElement("span"); s.className="sp"; s.style.cssText=`width:${size}px;height:${size}px;margin:${-size/2}px 0 0 ${-size/2}px`; s.innerHTML=html; $("bloom").append(s); return s; }
function peek(){
  if(reduceMotion.matches||document.hidden) return;
  const lg=$("pLogo"), w=lg.offsetWidth, h=lg.offsetHeight;
  const side=pick(["l","r","t","l","r","t"]); let x,y;
  if(side==="t"){ x=(Math.random()-.5)*w*.7; y=-h/2; } else { x=(side==="l"?-1:1)*w/2; y=(Math.random()-.65)*h*.7; }
  const len=Math.hypot(x,y)||1, ux=x/len, uy=y/len, out=12+Math.random()*9, size=20+Math.random()*10;
  const kind=Math.random(), outAng=Math.atan2(uy,ux)*180/Math.PI;
  let html, rot;
  if(kind<.42){ html=SPR.leaf(pick(LEAVES)); rot=outAng+45; }                 // leaf tip points outward
  else if(kind<.8){ const c=pick(PETALS); html=SPR.flower(c,c==="#e0a526"?"#d9482b":"#e0a526"); rot=Math.random()*72; }
  else { html=SPR.spark("#e0a526"); rot=0; }
  const s=sprite(html,size), ix=x-ux*size*.7, iy=y-uy*size*.7, ox=x+ux*out, oy=y+uy*out;
  const T=(px,py,r,sc)=>`translate(${px}px,${py}px) rotate(${r}deg) scale(${sc})`;
  s.animate([
    {transform:T(ix,iy,rot,.5),easing:"cubic-bezier(.3,1.7,.5,1)"},
    {transform:T(ox,oy,rot-10,1),offset:.2,easing:"ease-in-out"},
    {transform:T(ox,oy,rot+12,1),offset:.5,easing:"ease-in-out"},
    {transform:T(ox,oy,rot-6,1),offset:.78,easing:"cubic-bezier(.6,0,.8,.4)"},
    {transform:T(ix,iy,rot,.5)}
  ],{duration:2600}).onfinish=()=>s.remove();
}
let lastBurst=0;
function burst(){
  if(reduceMotion.matches||performance.now()-lastBurst<1200) return; lastBurst=performance.now();
  const lg=$("pLogo"), R=Math.max(lg.offsetWidth,lg.offsetHeight)*.55;
  for(let i=0;i<10;i++){
    const t=i/10*Math.PI*2+Math.random()*.5, d=R+18+Math.random()*28, size=10+Math.random()*8, r=Math.random()*360;
    const s=sprite(Math.random()<.55?SPR.petal(pick(PETALS)):SPR.leaf(pick(LEAVES)),size);
    s.animate([{transform:`translate(0,0) rotate(${r}deg) scale(.4)`,opacity:1},
               {transform:`translate(${Math.cos(t)*d}px,${Math.sin(t)*d+16}px) rotate(${r+220}deg) scale(1)`,opacity:0}],
      {duration:900+Math.random()*400,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>s.remove();
  }
}

    r.innerHTML=`<button type="button" class="icbtn" aria-label="Choose icon"></button><input type="text" class="ll" placeholder="Label (e.g. GitHub)" value="${esc(l.label||"")}"><input type="text" class="lu" placeholder="https://…" value="${esc(l.url||"")}"><button type="button" class="rm" aria-label="Remove link">✕</button>`;
    const lu=r.querySelector(".lu"), ll=r.querySelector(".ll"), ib=r.querySelector(".icbtn");
    const paint=()=>{ const k=r.dataset.icon!=="auto"?r.dataset.icon:detectIcon(lu.value.trim()); ib.innerHTML=svg(k); ib.style.background=KIND[k]?.color||"#6e6255";
      ib.title = r.dataset.icon==="auto" ? "Icon: auto (from URL)" : "Icon: "+KIND[k].name; };
    ib.onclick=e=>{ e.stopPropagation(); const open=r.querySelector(".icmenu"); document.querySelectorAll(".icmenu").forEach(m=>m.remove()); if(open) return;
      const m=document.createElement("div"); m.className="icmenu";
      m.innerHTML=[["auto","Auto","#6e6255"],...KINDS].map(([k,n,c])=>`<button type="button" class="icopt${r.dataset.icon===k?" sel":""}" data-k="${k}"><i style="background:${c}">${k==="auto"?'<span style="font:700 11px Space Grotesk">AUTO</span>':svg(k)}</i>${n}</button>`).join("");
      m.onclick=ev=>{ const b=ev.target.closest(".icopt"); if(!b) return; ev.stopPropagation(); r.dataset.icon=b.dataset.k; paint(); m.remove();
        if(!ll.value.trim() || ll.dataset.auto==="1"){
          if(b.dataset.k!=="auto"){ ll.value=KIND[b.dataset.k].name; ll.dataset.auto="1"; }
          else { ll.value=lu.value.trim()?linkLabel(lu.value.trim()):""; ll.dataset.auto=ll.value?"1":""; }
          ll.classList.remove("flash"); void ll.offsetWidth; ll.classList.add("flash");
        } };
      r.append(m); };
    paint();
    lu.addEventListener("input",()=>{ $("fErr").textContent=""; paint(); if(!ll.dataset.touched) ll.placeholder=lu.value?linkLabel(lu.value.trim()):"Label (e.g. GitHub)"; });
    ll.addEventListener("input",()=>{ ll.dataset.touched=1; ll.dataset.auto=""; });
    r.querySelector(".rm").onclick=()=>r.remove();
    box.append(r); return r; };
  (initial||[]).forEach(add);
  $("add_"+f.k).onclick=()=>add().querySelector(".lu").focus();
}
function readLinks(f){
  const out=[]; for(const r of $("f_"+f.k).querySelectorAll(".lrow")){
    const url=r.querySelector(".lu").value.trim(), label=r.querySelector(".ll").value.trim();
    if(!url && !label) continue;
    if(!/^https?:\/\//i.test(url)) return null;
    const icon=r.dataset.icon; const o={label: label||(icon!=="auto"&&KIND[icon]?KIND[icon].name:linkLabel(url)), url}; if(icon&&icon!=="auto") o.icon=icon; out.push(o);
  } return out;
}
function armed(btn,label,fn){ btn.onclick=()=>{ if(btn.classList.contains("armed")) return fn(); btn.classList.add("armed"); btn.textContent=label; setTimeout(()=>{btn.classList.remove("armed");btn.textContent=btn.dataset.l},2500); }; btn.dataset.l=btn.textContent; }

function openForm({title,fields,values,onSave,onDelete,extra,hint}){
  $("fTitle").textContent=title;
  $("fBody").innerHTML=`<form id="theForm" novalidate>
      <div class="form">${fields.map(f=>field(f.type==="image"?{...f,pos:values[f.k+"Pos"],zoom:values[f.k+"Zoom"]}:f, f.type==="media"?values:(values[f.k]??""))).join("")}</div>
      <div class="err" id="fErr"></div>
      ${hint?`<div class="hint">${hint}</div>`:""}
      <div class="factions">
        <button type="submit" class="btn">Save</button>
        <button type="button" class="btn ghost" id="fCancel">Cancel</button>
        <span class="sp"></span>
        ${(extra||[]).map((x,i)=>`<button type="button" class="btn ghost" id="fx${i}">${x.label}</button>`).join("")}
        ${onDelete?`<button type="button" class="btn danger" id="fDel">Delete</button>`:""}
      </div></form>`;
  $("fCancel").onclick=closeForm;
  (extra||[]).forEach((x,i)=>$("fx"+i).onclick=x.fn);
  if(onDelete) armed($("fDel"),"Click again to delete",()=>{ onDelete(); closeForm(); persist(); toast("Deleted"); });
  fields.forEach(f=>{ const el=$("f_"+f.k); el && el.addEventListener("input",()=>$("fErr").textContent=""); if(f.type==="image") wireImage(f); if(f.type==="links") wireLinks(f,values[f.k]); if(f.type==="media") wireMedia(f,values); });
  $("theForm").onsubmit=e=>{
    e.preventDefault();
    const out={}; fields.forEach(f=>{ const el=$("f_"+f.k);
      out[f.k]= f.type==="checkbox"?el.checked : f.type==="links"?readLinks(f) : el.value.trim();
      if(f.type==="image"){ out[f.k+"Pos"]=$("p_"+f.k).value; out[f.k+"Zoom"]=Number($("z_"+f.k).value); }
      if(f.type==="media"){ out.media=document.querySelector(`input[name="m_${f.k}"]:checked`).value; out.video=$("f_video").value.trim(); out.shots=JSON.parse(el.value||"[]"); } });
    if(out.video && !ytId(out.video)){ $("fErr").textContent="That doesn't look like a YouTube link."; $("f_video").focus(); return; }
    const bad=fields.find(f=>f.type==="links" && out[f.k]===null);
    if(bad){ $("fErr").textContent="Each link needs a URL starting with http:// or https://"; return; }
    const missing=fields.find(f=>f.req && !out[f.k]);
    if(missing){ $("fErr").textContent=`${missing.label} is required.`; $("f_"+missing.k).focus(); return; }
    if(onSave(out)===false) return;
    closeForm(); persist(); toast("Saved");
  };
  fo.classList.add("open"); const firstIn=$("fBody").querySelector("input,textarea,select"); firstIn&&firstIn.focus();
}

function listOf(group){ return group==="side" ? DATA.side : DATA.studios[group].games; }
function gameForm(group,idx){
  const list=listOf(group), g = idx>=0 ? list[idx] : {};
  const groups=[...DATA.studios.map((s,i)=>[i,s.company]),["side","Side projects"]];
  const move=d=>{ const j=idx+d; if(j<0||j>=list.length) return; [list[idx],list[j]]=[list[j],list[idx]]; persist(); gameForm(group,j); toast(d<0?"Moved up":"Moved down"); };
  openForm({
    title: idx>=0 ? "Edit project" : "New project",
    fields:[
      {k:"name",label:"Name",req:true,ph:"Marble Away!"},
      {k:"group",label:"Section",type:"select",options:groups},
      {k:"image",label:"Game image",type:"image",full:true,aspect:16/9,max:960},
      {k:"downloads",label:"Downloads",ph:"3K+  (leave empty if none)"},
      {k:"note",label:"Short note",ph:"Puzzle · Unreleased · On store"},
      {k:"mediaf",label:"Showcase",type:"media"},
      {k:"links",label:"Links",type:"links"},
      {k:"desc",label:"Description",type:"textarea",full:true,ph:"Your role, key features, tech used (1–2 lines)"},
      {k:"store",label:"Released on store (counts as shipped)",type:"checkbox",full:true}
    ],
    values:{...g, group},
    extra: idx>=0 ? [{label:"↑",fn:()=>move(-1)},{label:"↓",fn:()=>move(1)}] : [],
    onDelete: idx>=0 ? ()=>list.splice(idx,1) : null,
    onSave:o=>{
      const target=o.group==="side"?"side":Number(o.group);
      const obj={name:o.name}; ["image","downloads","note","desc"].forEach(k=>{ if(o[k]) obj[k]=o[k]; });
      if(o.video) obj.video=o.video; if(o.shots&&o.shots.length) obj.shots=o.shots;
      obj.media=o.media;
      if(o.image){ if(o.imagePos&&o.imagePos!=="50% 50%") obj.imagePos=o.imagePos; if(o.imageZoom>1) obj.imageZoom=o.imageZoom; } if(o.links&&o.links.length) obj.links=o.links; if(o.store) obj.store=true;
      if(idx>=0 && String(target)===String(group)) list[idx]=obj;
      else { if(idx>=0) list.splice(idx,1); listOf(target).push(obj); }
    }
  });
}
function studioForm(si){
  const s = si>=0 ? DATA.studios[si] : {};
  const move=d=>{ const j=si+d; if(j<0||j>=DATA.studios.length) return; const a=DATA.studios; [a[si],a[j]]=[a[j],a[si]]; persist(); studioForm(j); };
  openForm({
    title: si>=0 ? "Edit studio" : "New studio",
    fields:[{k:"company",label:"Company",req:true,ph:"JoyBoy Game"},{k:"period",label:"Period",ph:"08/2026 — Present"}],
    values:s,
    extra: si>=0 ? [{label:"↑",fn:()=>move(-1)},{label:"↓",fn:()=>move(1)}] : [],
    hint: si>=0 && s.games.length ? `Deleting this studio also deletes its ${s.games.length} project(s).` : "",
    onDelete: si>=0 ? ()=>DATA.studios.splice(si,1) : null,
    onSave:o=>{ if(si>=0){ s.company=o.company; s.period=o.period; } else DATA.studios.unshift({company:o.company,period:o.period,games:[]}); }
  });
}

function dataForm(){
  $("fTitle").textContent="Export / Import";
  const json=JSON.stringify(DATA,null,2);
  $("fBody").innerHTML=`<div class="f full"><label for="f_json">Your data</label><textarea id="f_json" class="code">${esc(json)}</textarea></div>

  $("dApply").onclick=()=>{ try{ const d=JSON.parse($("f_json").value); if(!d.profile||!Array.isArray(d.studios)||!Array.isArray(d.side)) throw 0; DATA=normalize(d); closeForm(); persist(); toast("Applied"); }catch(e){ $("fErr").textContent="That doesn't look like valid portfolio data."; } };
  armed($("dReset"),"Click again to reset",()=>{ DATA=clone(DEFAULT_DATA); try{localStorage.removeItem(KEY)}catch(e){} closeForm(); render(); toast("Reset"); });

/* ============================================================
   SAVE TO PROJECT (Chrome / Edge — File System Access API)
   Pick the repo folder once; afterwards every save writes
   pasted images to images/<name>-<hash>.webp and rewrites
   DEFAULT_DATA inside index.html. Unused images are removed.
   ============================================================ */
const MK_A="/*@"+"DATA*/", MK_B="/*@"+"END*/";
const IDB={
  db:null,
  open(){ return this.db||(this.db=new Promise((res,rej)=>{ const r=indexedDB.open("dv-portfolio-fs",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); },
  async get(k){ const db=await this.open(); return new Promise((res,rej)=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async set(k,v){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
};
const slug=s=>String(s||"").normalize("NFD").replace(/\p{M}/gu,"").replace(/đ/gi,"d").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"img";
async function readIndex(dir){
  try{ const fh=await dir.getFileHandle("index.html"); const t=await (await fh.getFile()).text();
    return t.includes(MK_A)&&t.includes(MK_B)?{fh,t}:null; }catch(e){ return null; }
}
async function fileExists(dir,name){ try{ await dir.getFileHandle(name); return true; }catch(e){ return false; } }
async function writeFile(dir,name,data){ const w=await (await dir.getFileHandle(name,{create:true})).createWritable(); await w.write(data); await w.close(); }

function setStatus(msg,isErr){ const el=$("saveStatus"); if(!el) return; el.style.display=msg?"":"none"; el.style.color=isErr?"#ff8a73":"var(--gold)"; el.textContent=msg||""; }
let DIR_MEM=null;
/* the picked folder may be the repo itself or its parent — find index.html either way */
async function findIndex(dir){
  let idx=await readIndex(dir); if(idx) return {dir,idx};
  for await(const [n,h] of dir.entries()) if(h.kind==="directory"){ idx=await readIndex(h); if(idx) return {dir:h,idx}; }
  return null;
}
/* interactive=true may show the folder picker / permission prompt (needs a click) */
async function getProjectDir(interactive){
  let dir=DIR_MEM; if(!dir) try{ dir=await IDB.get("dir"); }catch(e){ console.warn("IndexedDB read failed",e); }
  if(dir){
    let p=await dir.queryPermission({mode:"readwrite"});
    if(p!=="granted" && interactive) p=await dir.requestPermission({mode:"readwrite"});
    if(p!=="granted") dir=null;
  }
  let found=dir?await findIndex(dir):null;
  if(!found){
    if(!interactive) return null;
    const picked=await showDirectoryPicker({id:"dv-portfolio",mode:"readwrite"});
    found=await findIndex(picked);
    if(!found) throw new Error(`Folder "${picked.name}" has no index.html with the data markers — pick the dungvu.github.io folder.`);
    try{ await IDB.set("dir",found.dir); }catch(e){ console.warn("IndexedDB write failed (folder kept for this session only)",e); }
  }
  DIR_MEM=found.dir;
  return found;
}

let saving=false, saveAgain=false;
async function saveProject(interactive=true){
  if(!window.showDirectoryPicker){ if(interactive) toast("Save to project needs Chrome or Edge — use Export instead"); return; }
  if(saving){ saveAgain=true; return; }
  saving=true; const btn=document.querySelector('[data-act="save"]'); if(btn) btn.textContent="Saving…";
  try{
    const proj=await getProjectDir(interactive); if(!proj) return;
    const {dir,idx}=proj, imgDir=await dir.getDirectoryHandle("images",{create:true});
    const data=clone(DATA), map=new Map(), used=new Set(); let added=0;
    const walk=async(o,label)=>{ for(const k of Object.keys(o)){ const v=o[k];
      if(typeof v==="string"){
        const m=/^data:image\/(webp|jpeg|png|gif);base64,/.exec(v);
        if(!m){ const p=/^images\/([^/?#]+)$/.exec(v); if(p) used.add(p[1]); continue; }
        if(!map.has(v)){
          const bytes=await (await fetch(v)).arrayBuffer();
          const h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",bytes))].slice(0,6).map(b=>b.toString(16).padStart(2,"0")).join("");
          const name=`${slug(label)}-${h}.${m[1]==="jpeg"?"jpg":m[1]}`;
          if(!(await fileExists(imgDir,name))){ await writeFile(imgDir,name,bytes); added++; }
          map.set(v,"images/"+name);
        }
        o[k]=map.get(v); used.add(map.get(v).slice(7));
      } else if(v&&typeof v==="object") await walk(v, v.name||v.company||label);
    }};
    await walk(data,"img");
    // remove images this tool created that nothing references any more
    const stale=[]; for await(const [n,h] of imgDir.entries()) if(h.kind==="file" && /-[0-9a-f]{12}\.(webp|jpg|png|gif)$/.test(n) && !used.has(n)) stale.push(n);
    for(const n of stale) await imgDir.removeEntry(n);
    // rewrite DEFAULT_DATA in index.html
    const a=idx.t.indexOf(MK_A)+MK_A.length, b=idx.t.indexOf(MK_B);
    const out=idx.t.slice(0,a)+JSON.stringify(data,null,2).replace(/</g,"\\u003c")+idx.t.slice(b);
    const changed=out!==idx.t; if(changed) await writeFile(dir,"index.html",out);
    // swap data URLs for file paths in the live data (keeps edits made while saving)
    const swap=o=>{ for(const k of Object.keys(o)){ const v=o[k]; if(typeof v==="string"&&map.has(v)) o[k]=map.get(v); else if(v&&typeof v==="object") swap(v); } };
    swap(DATA); try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){} render();
    const parts=[]; if(added) parts.push(`${added} image${added>1?"s":""} added`); if(stale.length) parts.push(`${stale.length} removed`);
    const msg=changed||added||stale.length ? `✓ Saved to ${dir.name}${parts.length?" — "+parts.join(", "):""} · ready to push` : `✓ ${dir.name} already up to date`;
    toast(msg); setStatus(msg+"  ("+new Date().toLocaleTimeString()+")");
  }catch(e){
    if(e&&e.name==="AbortError") toast("Cancelled");
    else { console.error(e); const msg="✗ Save failed: "+(e&&e.name?e.name+" — ":"")+(e&&e.message?e.message:String(e)); toast(msg); setStatus(msg,true); }
  }finally{
    saving=false; if(btn) btn.textContent="Save to project";
    if(saveAgain){ saveAgain=false; saveProject(false); }
  }
}
/* after the folder is linked, every edit syncs to disk automatically */
let syncT=null;
function autoSync(){ if(!EDIT||!window.showDirectoryPicker) return; clearTimeout(syncT); syncT=setTimeout(()=>saveProject(false),500); }
addEventListener("keydown",e=>{ if(EDIT && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); saveProject(true); } });

render();
/* once the page has settled, quietly warm the first screenshots of every project */
addEventListener("load",()=>setTimeout(()=>{
  const all=[...DATA.studios.flatMap(s=>s.games),...DATA.side], idle=window.requestIdleCallback||(f=>setTimeout(f,200));
  let i=0; (function step(){ if(i>=all.length) return; preloadShots(all[i++],3); idle(step); })();
},1200));
</script>
